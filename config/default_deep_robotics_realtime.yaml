# =====================================================================
# 实时建图配置文件（低性能处理器 / 机器狗机载电脑）
# 基于 default_deep_robotics_accuracy.yaml（高精度）与
# default_deep_robotics.yaml（在线建图）改造。
# 目标：在 RK3588 等低算力平台上以 10 Hz 实时完成 LIO 建图。
# 策略：降低点云密度、减少迭代次数、缩小邻近体素搜索、关闭回环/UI/RViz，
#       以牺牲精度换取单帧耗时，保证不积压、不丢帧。
# 地图输出目录：./data/map_realtime/（实时定位配置文件默认加载该地图）
# =====================================================================

common:
  lidar_topic: "/LIDAR/POINTS"
  livox_lidar_topic: "/livox/lidar" # 不使用，也要有，否则会报错
  imu_topic: "/IMU"

# fasterlio 参数
fasterlio:
  lidar_type: 4                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,  4 or RoboSense LiDAR
  scan_line: 32
  blind: 0.5                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 2 # 点云跳帧。1=隔帧LIO，中间帧位姿由IMU递推（减半计算量，精度进一步下降）
  point_filter_num: 24 # 点云采样（越大参与计算的点越少）。高精度=4/6，实时=8，低功耗=16
  max_lidar_buffer_size: 20 # LIO 内部等待 IMU 覆盖的点云帧上限
  max_imu_buffer_size: 4000
  imu_buffer_duration: 5.0
  imu_buffer_guard_time: 0.2
  robosense_rebatch: true
  robosense_scan_period: 0.1
  robosense_rebatch_delay: 0.3
  robosense_publish_time_threshold: 0.05
  robosense_mode_probe_frames: 5
  robosense_min_bin_points: 100
  max_iteration: 2 # IEKF 最大迭代次数。高精度=6，实时=3，低功耗=2
  filter_size_scan: 0.8 # 当前帧体素降采样，越大点越少。高精度=0.294，实时=0.6，低功耗=0.8
  filter_size_map: 0.8 # LIO 局部地图体素分辨率，同上
  ivox_grid_resolution: 0.8 # iVox 栅格分辨率，越大栅格越少、检索越快
  ivox_nearby_type: 6 # 邻近栅格 6/18/26。6=仅面邻域，检索代价最低（精度下降明显）
  esti_plane_threshold: 0.1        # default=0.1
  use_aa: false  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [ 0, 0, 0 ]
  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false

g2p5:
  esti_floor: false   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -1.2   # 默认地面高度
  min_th_floor: 0.50  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 1.0  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.2 # 栅格地图分辨率

system:
  async_lio: true # 在线回调只入队，由单独 worker 串行运行 LIO
  async_lio_max_pending_lidar: 60 # 原始点云事件队列上限（调小：负载跟不上时丢弃旧帧，降低滞后感而非越积越多）
  async_lio_max_pending_imu: 20000 # 原始 IMU 事件队列上限
  imu_qos_depth: 2000
  lidar_qos_depth: 20
  imu_qos_reliable: true
  lidar_qos_reliable: true
  with_loop_closing: false # 实时模式关闭回环检测（全局NDT匹配最耗时）；需要全局一致地图时用离线建图补跑
  with_ui: false # 机载端关闭 Pangolin 3D UI（RK3588 无显示且 EGL 初始化会崩溃）
  with_2dui: false # 是否需要2D UI
  with_g2p5: false # 关闭栅格地图
  step_on_kf: false # 是否在关键帧处暂停
  enable_lidar_loc_skip: false
  log_pose_opt: false # 命令行打印位置和速度
  pub_odom: true # 发布 /lightning/odom 与 nav_state
  enable_lidar_loc_rviz: true # 发布 /current_scan_cloud 与 /global_map_cloud，RViz 才能看到正在构建的地图
  rviz_current_scan_topic: "/current_scan_cloud"
  rviz_global_map_topic: "/global_map_cloud"
  enable_path_rviz: true # 发布 /lightning/path 轨迹（enable_lidar_loc_rviz=true 时也会强制开启）
  enable_lidar_odom_skip: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: 。/map_realtime/ # 实时建图输出目录（大分区）
  pub_tf: true
  use_imu_orient: false

loop_closing:
  loop_kf_gap: 10       # 每隔多少个关键帧检查一次
  min_id_interval: 20   # 被检查的关键帧ID间隔
  closest_id_th: 20     # 历史关键帧与当前帧的ID间隔
  max_range: 60.0       # 候选帧的最大距离
  ndt_score_th: 1.0     # ndt位姿分值
  with_height: true

### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 30.0
  grid_search_angle_step: 6
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false

maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false

# fuse LIO, LiDAR localization( requires a pre-built map), Dead Reckoning, RTK
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01

roi:
  # 收窄高度范围可大幅减少参与计算的点数（单位：米）
  height_max: 1.5 # 高于雷达 1.5m 的树冠/天花板等低价值点直接剔除
  height_min: -1.0 # 保留地面及其下方少许，提供地面约束
  range_max: 50 # 当前版本LIO仅使用高度ROI，本字段保留兼容
  range_min: 1.0

ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1
